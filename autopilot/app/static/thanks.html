<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment received</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f6f8; color: #141821; font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px; }
    .card { background: #fff; border: 1px solid #e7e9ee; border-radius: 18px; padding: 32px 24px; max-width: 380px; text-align: center; box-shadow: 0 12px 40px rgba(20,24,33,.07); }
    .check { width: 52px; height: 52px; border-radius: 50%; background: #e7f6ef; color: #0b8f63; display: grid; place-items: center; font-size: 26px; margin: 0 auto 14px; }
    h1 { font-size: 21px; margin: 0 0 6px; }
    p { color: #6a7280; margin: 0; font-size: 14px; }
    a { display: inline-block; margin-top: 18px; color: #0e7c74; font-weight: 600; text-decoration: none; font-size: 13.5px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Payment received</h1>
    <p>Thank you. A receipt was texted to you, and the business has been notified.</p>
    <a href="/">Done</a>
  </div>
</body>
</html>
